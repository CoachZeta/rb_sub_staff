<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ndemo">
<meta name="theme-color" content="#0f1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Ndemo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Chakra+Petch:wght@500;600&display=swap">
<style>
/* Layout: tablet orizzontale da panchina. Colori del Rhodigium Basket: blu notte di fondo, azzurro per azioni e cronometro, rosso della rosa solo per l'identità */
:root{
  color-scheme:dark;
  --bg:#0f1530;
  --panel:#18204a;
  --panel2:#1f2a5c;
  --court:#203272;
  --line:#2d3b7a;
  --fg:#eef3fb;
  --mu:#9aa8cc;
  --azz:#a8d8f0;
  --azz-ink:#0f1530;
  --rosa:#d8303c;
  --ok:#4fc985;
  --warn:#f2b04a;
  --bad:#ef5f5f;
  --bench:#2a3566;
  --ui:"Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Chakra Petch",ui-monospace,"SF Mono",Menlo,monospace;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--ui);font-size:16px;line-height:1.4;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:26px}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
.mu{color:var(--mu)}
.small{font-size:13px}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mu)}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-size:16px;font-weight:500;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#4a5aa0}
.btn:focus-visible,.prow:focus-visible,.pick:focus-visible,.team:focus-visible,.hist:focus-visible{outline:2px solid var(--azz);outline-offset:2px}
.btn.pri{background:var(--azz);color:var(--azz-ink);border-color:var(--azz)}
.btn.danger{color:var(--bad);border-color:#6a2b3a}
.btn.sm{min-height:36px;padding:4px 10px;font-size:15px}
.btn.adj{min-width:46px;justify-content:center;font-family:var(--num)}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;box-sizing:border-box}
textarea{width:100%;min-height:140px;font-family:var(--num);font-size:12px}
input[type=range]{min-height:0;padding:0;accent-color:var(--azz);width:100%}
.err{color:var(--bad);font-size:14px}
.note{color:var(--azz);font-size:14px}
.banner{border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.banner.bad{border-color:var(--bad);color:var(--bad)}
.banner.warn{border-color:var(--warn);color:var(--warn)}
.banner.acc{border-color:var(--azz)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
/* intestazione */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--rosa)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:48px;height:48px}
.brand .nm{font-size:22px;font-weight:600;letter-spacing:1px;line-height:1}
.brand .nm em{font-style:normal;color:var(--rosa)}
.brand .sub{font-size:13px;color:var(--azz)}
/* copertina */
.splash{position:relative;min-height:calc(100dvh - 32px);border-radius:20px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center}
.splash svg.court{position:absolute;inset:0;width:100%;height:100%}
.splash .inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px 16px}
.splash img{width:160px;height:160px}
.splash .club{font-size:13px;letter-spacing:4px;color:var(--azz)}
.splash .title{font-size:clamp(64px,12vw,112px);font-weight:600;letter-spacing:3px;line-height:.95}
.splash .title em{font-style:normal;color:var(--rosa)}
.splash .tag{font-size:20px;color:#cfd8ee;font-style:italic}
.splash .go{margin-top:14px;background:var(--azz);color:var(--azz-ink);border:none;border-radius:999px;padding:14px 56px;font:inherit;font-size:20px;font-weight:600;cursor:pointer}
.splash .go:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.splash .ver{position:absolute;right:16px;bottom:12px;font-size:13px;color:#7d8ab0}
.splash .off{position:absolute;left:16px;bottom:12px;font-size:13px;color:#7d8ab0}
/* squadre e liste */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.team{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:var(--fg)}
.team:hover{border-color:var(--azz)}
.team b{font-size:24px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:54px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:inherit;color:var(--fg);text-align:left}
.pick.dim{opacity:.72}
.pick.on{border-color:var(--azz);background:var(--court);opacity:1}
.pick .who{display:flex;gap:8px;align-items:center;min-width:0}
.pick .who b{font-family:var(--num);font-weight:500;color:var(--azz);min-width:24px}
.pick .who span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.pick.on .ck{background:var(--rosa);border-color:#fff}
.role{font-size:13px;color:var(--mu)}
.steps{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--mu)}
.steps .cur{color:var(--azz)}
.hist{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;cursor:pointer;font:inherit;color:var(--fg);text-align:left;width:100%}
.hist:hover{border-color:var(--azz)}
/* partita */
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.clock{font-family:var(--num);font-size:60px;line-height:1;font-weight:600;min-width:200px;text-align:center;font-variant-numeric:tabular-nums}
.clock.run{color:var(--azz)}
.clockwrap{display:flex;align-items:center;gap:6px;justify-content:center}
.ctrls{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:900px){.top{grid-template-columns:1fr}.ctrls{justify-content:flex-start}.clock{font-size:46px;min-width:140px}}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.colhead,.prow{display:grid;grid-template-columns:minmax(0,1fr) 64px 70px 64px;gap:10px;align-items:center}
.colhead{padding:0 12px 6px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mu)}
.colhead span:nth-child(n+3){text-align:right}
.prow{min-height:62px;padding:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;margin-bottom:8px}
.prow.on{background:var(--court);border-color:#3d52a0}
.prow.sel{outline:3px solid var(--azz);outline-offset:-1px}
.prow.tgt{outline:3px dashed var(--azz);outline-offset:-1px}
.prow.out{border-color:var(--bad)}
.pn{display:flex;align-items:center;gap:8px;min-width:0}
.pn .num{font-family:var(--num);font-size:18px;color:var(--azz);min-width:26px}
.pn .nm{font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:inline-flex;gap:3px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--azz)}
.dots i.w{background:var(--warn)}
.dots i.b{background:var(--bad)}
.fbar{height:10px;border-radius:5px;background:var(--bench);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:5px}
.stint,.tot{font-family:var(--num);font-variant-numeric:tabular-nums;text-align:right;font-size:17px;line-height:1.1}
.stint{color:var(--mu)}
.stint small{display:block;font-family:var(--ui);font-size:11px;color:var(--azz)}
.stint.warn{color:var(--warn)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#ghost{position:fixed;pointer-events:none;z-index:50;width:min(420px,80vw);opacity:.92;display:none}
/* tabelle e strisce */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #222d5c;white-space:nowrap}
td.n,th.r{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.kpi .k1{font-size:13px;color:var(--mu);line-height:1.25;min-height:33px}
.kpi .k2{font-family:var(--num);font-size:28px;font-weight:600;color:var(--azz);line-height:1.1;white-space:nowrap}
.kpi .k3{font-size:13px;min-height:18px}
.kpi .kb{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-top:6px;background:var(--bench)}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:24px;vertical-align:middle}
.bars i{display:block;width:6px;border-radius:1px;background:#4a5a96}
.bars i.r{background:var(--azz)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.srow{display:grid;grid-template-columns:130px minmax(0,1fr) 190px;gap:12px;align-items:center;padding:6px 0;border-top:1px solid #222d5c}
@media (max-width:700px){.srow{grid-template-columns:100px minmax(0,1fr)}.srow .ph{grid-column:1/-1}}
.strip{position:relative;display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--bench)}
.strip i{display:block;height:100%}
.strip .sep{position:absolute;top:0;bottom:0;width:3px;background:var(--panel)}
.pcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pcard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pcard .hd b{font-size:18px;font-weight:600}
.lanes{display:grid;grid-template-columns:78px minmax(0,1fr);gap:6px 8px;align-items:center}
.lanes .ll{font-size:14px;color:#c4cde6}
.lane{position:relative;height:32px;background:#1c2550;border-radius:6px;overflow:hidden}
.lane i{position:absolute;top:0;bottom:0;display:block}
.lane .lb{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--azz-ink);font-family:var(--num)}
.lane .ql{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--fg);opacity:.5}
.qhead{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;font-size:14px;color:#c4cde6;font-weight:500}
.qhead .qs{display:flex}
.qhead .qs span{text-align:center}
th.hl,td.hl{background:var(--court)}
td.hl{font-weight:600;font-size:17px}
th.hl{color:var(--azz)}
.ftab{display:flex;flex-direction:column}
.frow{display:grid;grid-template-columns:120px minmax(0,1fr) 160px;gap:10px;align-items:center;padding:6px 8px;border-radius:8px}
.frow:nth-child(even){background:#1b2452}
.fhead{font-size:13px;color:#c4cde6;line-height:1.25;border-bottom:1px solid var(--line);border-radius:0;padding-bottom:6px}
.fhead b{color:var(--fg);font-weight:600}
.fhead .qs{display:flex;font-size:14px;font-weight:500}
.fhead .qs span{text-align:center}
.frow .fn{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fp{font-size:15px;text-align:right}
.lanes2{display:flex;flex-direction:column;gap:2px;min-width:0}
.lanes2 .lane{height:22px;border-radius:4px;background:#141b3d}
.lanes2 .lane.l2{height:18px}
.lanes2 .lane .lb{font-size:13px}
.lanes2 .lane.l2 .lb{font-size:12px}
@media (max-width:700px){.frow{grid-template-columns:90px minmax(0,1fr)}.frow .fp{grid-column:1/-1;text-align:left}.fhead span:last-child{display:none}}
.qn{display:flex;flex-direction:column}
.qn small{font-family:var(--num);font-size:12px;color:var(--azz)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="ghost"></div>

let db=null;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.rosters){let old=null;try{old=JSON.parse(localStorage.getItem(OLD))}catch(e){}
  db=old&&old.rosters&&Object.keys(old.rosters).length?{rosters:old.rosters,cfg:old.cfg||{},storico:[],team:null,game:null}:seed()}
db.cfg=db.cfg||{};db.storico=db.storico||[];
if(db.team&&!db.rosters[db.team])db.team=null;
if(db.game){db.game.running=false;assignSlots(db.game)}
function assignSlots(G){if(G.players.every(p=>p.slot!=null))return;[true,false].forEach(on=>G.players.filter(p=>p.on===on).sort((a,b)=>a.num-b.num).forEach((p,i)=>p.slot=i))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const cfgOf=t=>db.cfg[t]||(db.cfg[t]={red:7,rec:4});

const S={view:"splash",match:null,conv:[],sel5:[],form:false,edit:null,err:"",note:"",sel:null,confirm:null,newTeam:false,showCfg:false,newMatch:false,speed:1,showText:null,pendingImport:null,histId:null,tout:false,prep:false};
let timer=null,last=0,acc=0,ds=null,noClick=false,wl=null,pressing=false,releasedAt=0;
/* mentre il dito è sullo schermo (e subito dopo) la schermata non si ridisegna, così nessun tocco va perso */
const busy=()=>pressing||(ds&&ds.moved)||performance.now()-releasedAt<350;
const $=id=>document.getElementById(id);
const g=()=>db.game;

/* ---------- logica partita ---------- */
const ons=()=>g().players.filter(p=>p.on);
const lk=()=>ons().map(p=>p.num).sort((a,b)=>a-b).join("·");
function pairs(){const o=ons().map(p=>p.num).sort((a,b)=>a-b),r=[];for(let i=0;i<o.length;i++)for(let j=i+1;j<o.length;j++)r.push(o[i]+"+"+o[j]);return r}
const UP=()=>100/(g().red*60), DN=()=>100/(g().rec*60);
const zcol=v=>v>=100?"var(--bad)":v>=75?"var(--warn)":"var(--ok)";
const mOn=p=>Math.max(p.dOn,p.on?p.st:0), mB=p=>Math.max(p.dB,p.on?0:p.st);
/* timeline: un valore al secondo. In campo = fatica (>=0); in panchina = -1-fatica */
const tlFa=v=>v>=0?v:-1-v;

function step(){
  const G=g();G.rem--;
  const k=lk();G.L[k]=(G.L[k]||0)+1;pairs().forEach(x=>G.S2[x]=(G.S2[x]||0)+1);
  const up=UP(),dn=DN();
  G.players.forEach(p=>{p.st++;
    if(p.on){p.tot++;p.q[G.qi]=(p.q[G.qi]||0)+1;p.fa+=up;p.tl.push(Math.round(p.fa))}
    else{p.fa=Math.max(0,p.fa-dn);p.tl.push(-1-Math.round(p.fa))}});
  if(G.rem<=0)endPeriod();
}
function loop(){const now=performance.now();acc+=(now-last)*S.speed;last=now;let ch=false;
  while(acc>=1000&&g()&&g().running){acc-=1000;step();ch=true}
  if(ch)save();
  if(ch||pendingRender){if(busy())pendingRender=true;else{pendingRender=false;render()}}}
let pendingRender=false;
async function wake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>wl=null)}}catch(e){}}
function start(){const G=g();if(!G||G.phase!=="play"||G.rem<=0)return;G.running=true;S.tout=false;last=performance.now();acc=0;clearInterval(timer);timer=setInterval(loop,200);wake()}
function stop(){if(g())g().running=false;clearInterval(timer);save()}
function endPeriod(){stop();S.sel=null;S.tout=false;g().phase="summary";S.view="summary";S.confirm=null}
function nextPeriod(){const G=g(),dn=DN();
  if(G.qi===1)G.players.forEach(p=>{if(p.on)p.dOn=Math.max(p.dOn,p.st);else p.dB=Math.max(p.dB,p.st);p.st=0;p.fa=0;p.pz=false});
  else G.players.forEach(p=>{p.fa=Math.max(0,p.fa-120*dn);if(p.on&&p.st>0)p.pz=true});
  G.qi++;G.rem=perLen(G.qi);G.bounds.push(G.players[0].tl.length);G.phase="play";G.U=[];S.view="game";S.note="Si gioca il "+perName(G.qi);save()}
function endGame(){g().phase="ended";S.view="summary";save()}
function dispName(p,list){return list.some(x=>x!==p&&x.cognome.toLowerCase()===p.cognome.toLowerCase())?p.nome[0]+". "+p.cognome:p.cognome}
const nm=p=>"#"+p.num+" "+p.cognome;
function doSwap(a,b){const P=g().players;if(P[a].on===P[b].on)return false;
  const inc=P[a].on?b:a,out=P[a].on?a:b;
  if(P[inc].f>=5){S.err=nm(P[inc])+" ha 5 falli e non può rientrare";return false}
  g().U.push({t:"s",a,b,sa:P[a].st,sb:P[b].st,pa:P[a].pz,pb:P[b].pz});
  const sl=P[a].slot;P[a].slot=P[b].slot;P[b].slot=sl;
  P[out].dOn=Math.max(P[out].dOn,P[out].st);P[inc].dB=Math.max(P[inc].dB,P[inc].st);
  P[a].on=!P[a].on;P[b].on=!P[b].on;P[a].st=0;P[b].st=0;P[a].pz=false;P[b].pz=false;S.sel=null;
  S.note="Entra "+nm(P[inc])+", esce "+nm(P[out]);save();return true}
function adjust(d){const G=g();
  if(G.running){S.err="Metti in pausa il cronometro prima di correggerlo";return}
  if(d<0){/* il tempo è passato: lo faccio scorrere davvero */
    const n=Math.min(-d,G.rem);for(let i=0;i<n&&G.phase==="play";i++)step();
    if(G.phase==="play")S.note="Aggiunti "+n+" secondi a chi era in campo e in panchina";return}
  const elapsed=perLen(G.qi)-G.rem,minSt=Math.min(...G.players.map(p=>p.st));
  let n=Math.min(d,elapsed,minSt);
  if(n<=0){S.err=elapsed<=0?"Il cronometro è già all'inizio del periodo":"Non posso restituire tempo da prima dell'ultimo cambio";return}
  G.rem+=n;const k=lk();G.L[k]=Math.max(0,(G.L[k]||0)-n);pairs().forEach(x=>G.S2[x]=Math.max(0,(G.S2[x]||0)-n));
  G.players.forEach(p=>{p.st-=n;p.tl.splice(-n,n);if(p.on){p.tot-=n;p.q[G.qi]=Math.max(0,(p.q[G.qi]||0)-n)}
    p.fa=p.tl.length?tlFa(p.tl[p.tl.length-1]):0});
  S.note="Tolti "+n+" secondi"+(n<d?" (di più non si può: c'è stato un cambio)":"");save()}

/* statistiche fatica da timeline */
function fatStats(p){if(p.warnS!=null)return{warn:p.warnS,red:p.redS};let w=0,r=0;p.tl.forEach(v=>{if(v>=100)r++;else if(v>=75)w++});return{warn:w,red:r}}
function phrase(p){const s=fatStats(p);if(!p.tot)return['<span class="mu">Non è entrata</span>',""];
  if(s.red)return['<span style="color:var(--bad)">Zona rossa '+f(s.red)+"</span>","zona rossa "+f(s.red)];
  if(s.warn)return['<span style="color:var(--warn)">Attenzione '+f(s.warn)+"</span>","attenzione "+f(s.warn)];
  return['<span style="color:var(--ok)">Sempre fresca</span>',"sempre fresca"]}
function splitAt(a,b,cuts){const r=[];cuts.forEach(c=>{if(c>a&&c<b){r.push([a,c]);a=c}});r.push([a,b]);return r}
function qHead(bounds,n,qi){const st=bounds.concat([n]);let h="";for(let q=0;q<bounds.length;q++){const w=(Math.min(st[q+1],n)-st[q])/n*100;if(w>0)h+='<span style="width:'+w+'%">'+perShort(q)+"</span>"}return '<div class="frow fhead"><span>sopra: <b>campo</b><br>sotto: <b style="color:var(--azz)">panchina</b></span><div class="qs">'+h+"</div><span></span></div>"}
function lanesHtml(tl,bounds,sc){const n=tl.length,cuts=bounds.slice(1),pc=x=>(x/n*100)+"%";let top="",bot="";
  const lab=(a,b)=>{const w=(b-a)/n*100;return w>6?'<span class="lb" style="left:'+pc(a)+";width:"+w+'%">'+f((b-a)*sc)+"</span>":""};
  let i=0;while(i<n){const on=tl[i]>=0;let j=i;while(j<n&&(tl[j]>=0)===on)j++;
    if(on){let k=i;while(k<j){const c=zcol(tl[k]);let m=k;while(m<j&&zcol(tl[m])===c)m++;top+='<i style="left:'+pc(k)+";width:"+((m-k)/n*100)+"%;background:"+c+'"></i>';k=m}
      splitAt(i,j,cuts).forEach(x=>top+=lab(x[0],x[1]))}
    else{const long=(j-i)*sc>=480;splitAt(i,j,cuts).forEach(x=>{bot+='<i style="left:'+pc(x[0])+";width:"+((x[1]-x[0])/n*100)+"%;background:"+(long?"#f2d06a":"var(--azz)")+';box-shadow:inset -1px 0 0 #1c2550"></i>'+lab(x[0],x[1])})}
    i=j}
  const ql=cuts.filter(c=>c>0&&c<n).map(c=>'<span class="ql" style="left:'+pc(c)+'"></span>').join("");
  return '<div class="lanes2"><div class="lane l1">'+top+ql+'</div><div class="lane l2">'+bot+ql+"</div></div>"}
function dotsHtml(nf){if(!nf)return "";let h='<span class="dots" aria-label="'+nf+' falli">';for(let i=1;i<=nf;i++)h+='<i class="'+(i===5?"b":i===4?"w":"")+'"></i>';return h+"</span>"}

  h+='<div class="stack" style="gap:4px;align-items:center"><div class="clockwrap"><button class="btn adj" data-a="adj" data-v="-5">−5</button><button class="btn adj" data-a="adj" data-v="-1">−1</button><div class="clock'+(G.running?" run":"")+'">'+f(G.rem)+'</div><button class="btn adj" data-a="adj" data-v="1">+1</button><button class="btn adj" data-a="adj" data-v="5">+5</button></div><span class="small mu">Correggi i secondi a cronometro fermo</span></div>';

  if(S.confirm==="close")h+='<div class="banner warn" style="color:var(--fg)"><span class="stack" style="gap:2px"><b style="font-size:18px">Vuoi chiudere la partita adesso?</b><span class="mu">Il cronometro è fermo. Scegli cosa fare con i minuti registrati fin qui.</span></span><div class="row"><button class="btn pri" data-a="closeSave">Salva nello storico così com’è</button><button class="btn danger" data-a="askClose2">Elimina senza salvare</button><button class="btn" data-a="cancel">Torna alla partita</button></div></div>';
  if(S.confirm==="close2")h+='<div class="banner bad"><span>Sicuro? La partita verrà cancellata e non si potrà recuperare.</span><div class="row"><button class="btn danger" data-a="closeDel">Sì, elimina</button><button class="btn" data-a="cancel">No, torna alla partita</button></div></div>';
  if(red.length)h+='<div class="banner bad"><span>Zona rossa: '+red.map(p=>esc(p.cognome)+" ("+f(p.st)+" di fila)").join(", ")+"</span></div>";
  if(S.tout)h+='<div class="banner warn"><span>Time-out: tempo fermo, puoi fare i cambi. Conta come 1 minuto di recupero per tutte.</span><button class="btn" data-a="go">Riprendi il gioco</button></div>';
  const msg=S.err?'<span class="err">'+esc(S.err)+"</span>":S.sel!==null?'<span class="note">Selezionata '+esc(nm(P[S.sel]))+": tocca chi "+(P[S.sel].on?"entra dalla panchina":"esce dal campo")+"</span>":'<span class="note">'+esc(S.note||"Per un cambio trascina una giocatrice sopra un’altra, oppure toccale una dopo l’altra")+"</span>";
  h+='<div class="row between" style="min-height:44px">'+msg+'<div class="row">'+(S.sel!==null?'<button class="btn" data-a="foul">+ Fallo a '+esc(P[S.sel].cognome)+"</button>":"")+'<button class="btn" data-a="undo">Annulla ultima azione</button></div></div>';
  const head='<div class="colhead"><span>Giocatrice</span><span>Fatica</span><span>Da quanto</span><span>Totale</span></div>';
  const ord=on=>P.map((p,i)=>i).filter(i=>P[i].on===on).sort((x,y)=>P[x].slot-P[y].slot).map(i=>prow(P[i],i,P)).join("");
  h+='<div class="cols"><section><h3 style="padding:0 4px 6px">In campo</h3>'+head+ord(true)+'</section><section><div class="row between" style="padding:0 4px 6px"><h3>In panchina</h3><span class="small mu">la barra mostra il recupero</span></div>'+head+ord(false)+"</section></div>";
  h+='<div class="row between"><div class="legend"><span><i class="sw" style="background:var(--ok)"></i>fresca</span><span><i class="sw" style="background:var(--warn)"></i>attenzione</span><span><i class="sw" style="background:var(--bad)"></i>zona rossa ('+G.red+'′ di fila)</span><span>“Da quanto” giallo in panchina: oltre 8′</span></div><div class="row"><button class="btn sm" data-a="speed">'+(S.speed===1?"Prova veloce ×10":"Torna a velocità reale")+'</button><button class="btn sm" data-a="menu">Menu</button></div></div>';
  return h}

/* ---------- statistiche di stagione ---------- */
function seasonData(games){
  const P={},keyOf=p=>p.num+"|"+p.cognome.toLowerCase();
  const Ls={},Pairs={},Starts={};let subs=0,periods=0,usedSum=0,convSum=0,stMin=0,allMin=0;
  games.slice().reverse().forEach((g,gi)=>{
    const byNum={};g.players.forEach(p=>byNum[p.num]=p.cognome);
    const nm2=n=>byNum[n]||("#"+n);
    periods+=g.periods||((g.qi||0)+1);convSum+=g.players.length;usedSum+=g.players.filter(p=>p.tot>0).length;
    const starters=g.players.filter(p=>p.tl&&p.tl.length&&p.tl[0]>=0);
    const sk=starters.map(p=>p.num).sort((a,b)=>a-b);
    if(sk.length===5){const k=sk.map(nm2).join(" · ");Starts[k]=(Starts[k]||0)+1}
    g.players.forEach(p=>{
      const k=keyOf(p),o=P[k]||(P[k]={num:p.num,cognome:p.cognome,nome:p.nome,ruolo:p.ruolo,games:0,starts:0,tot:0,mins:[],stints:0,redG:0,redS:0,f:0});
      o.num=p.num;o.games++;o.tot+=p.tot;o.mins.push(p.tot);o.f+=p.f||0;
      const st=p.tl&&p.tl.length&&p.tl[0]>=0;if(st){o.starts++;stMin+=p.tot}allMin+=p.tot;
      let red=p.redS!=null?p.redS:0;if(p.redS==null&&p.tl)red=p.tl.filter(v=>v>=100).length*(g.scale||1);
      if(red>0){o.redG++;o.redS+=red}
      if(p.tl){let on=false,entries=0;p.tl.forEach((v,i)=>{const now=v>=0;if(now&&!on){o.stints++;if(i>0)entries++}on=now});subs+=entries}
    });
    Object.entries(g.L||{}).forEach(([k,v])=>{if(v<=0)return;const n=k.split("·").map(x=>nm2(+x)).join(" · ");const o=Ls[n]||(Ls[n]={s:0,g:0});o.s+=v;o.g++});
    Object.entries(g.S2||{}).forEach(([k,v])=>{if(v<=0)return;const [a,b]=k.split("+");const n=nm2(+a)+" + "+nm2(+b);Pairs[n]=(Pairs[n]||0)+v});
  });
  return {P:Object.values(P),Ls,Pairs,Starts,subs,periods,usedSum,convSum,stMin,allMin,n:games.length};
}
function vStats(){
  const t=db.team,all=db.storico.filter(s=>s.roster===t),N=S.statsN||0,games=N?all.slice(0,N):all;
  let h=brand(esc(t),'<button class="btn" data-a="backTeam">← Squadra</button>');
  h+='<div class="row between"><h1>Statistiche stagione · '+esc(t)+'</h1><div class="row">'+[["Tutta la stagione",0],["Ultime 5",5]].map(x=>'<button class="btn sm'+(N===x[1]?" pri":"")+'" data-a="statsN" data-v="'+x[1]+'">'+x[0]+"</button>").join("")+"</div></div>";
  if(!games.length)return h+'<div class="panel"><p>Non ci sono ancora partite salvate per questa squadra. A fine partita usa “Salva nello storico”: le statistiche si riempiono da sole.</p></div>';
  const D=seasonData(games),n=D.n,fm=x=>(Math.round(x*10)/10).toString().replace(".",",");
  const pl=D.P.map(o=>Object.assign(o,{avg:o.tot/o.games})).sort((a,b)=>b.avg-a.avg);
  const top=pl[0],stPct=D.allMin?Math.round(D.stMin/D.allMin*100):0,cpg=D.subs/n,cpq=D.subs/D.periods;
  h+='<div class="kpis">'+
    '<div class="kpi"><span class="k1">Partite</span><span class="k2">'+n+'</span><span class="k3">'+(N&&all.length>n?"ultime "+n+" su "+all.length:"")+'</span></div>'+
    '<div class="kpi"><span class="k1">Giocatrici usate in media</span><span class="k2">'+fm(D.usedSum/n)+'</span><span class="k3">su '+fm(D.convSum/n)+' convocate</span></div>'+
    '<div class="kpi"><span class="k1">Minuti titolari e panchina</span><span class="k2">'+stPct+' · '+(100-stPct)+'<span style="font-size:15px">%</span></span><span class="kb"><i style="width:'+stPct+'%;background:var(--azz)"></i></span></div>'+
    '<div class="kpi"><span class="k1">Cambi a partita</span><span class="k2">'+Math.round(cpg)+'</span><span class="k3">circa '+fm(cpq)+' per periodo</span></div>'+
    '<div class="kpi"><span class="k1">Giocatrice più utilizzata</span><span class="k2">'+f(top.avg).replace(/:\d\d$/,"′")+'</span><span class="k3">#'+top.num+" "+esc(top.cognome)+', a partita</span></div></div>';
  const bars=m=>'<span class="bars">'+m.slice(-8).map((v,i,a)=>'<i class="'+(i>=a.length-3?"r":"")+'" style="height:'+Math.max(3,Math.round(v/2400*24))+'px"></i>').join("")+"</span>";
  const trend=m=>{if(m.length<4)return '<span class="mu">–</span>';const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;const d=Math.round((avg(m.slice(-3))-avg(m.slice(0,-3)))/60);
    if(Math.abs(d)<2)return '<span class="mu">= stabile</span>';return d>0?'<span style="color:var(--ok)">↑ +'+d+'′</span>':'<span style="color:var(--warn)">↓ '+d+'′</span>'};
  const rows=pl.map(o=>{const rc=o.redG===0?"var(--ok)":o.redG>o.games/2?"var(--bad)":"var(--warn)";
    const rt=o.redG===0?"mai":"in "+o.redG+" su "+o.games+" · "+f(o.redS/o.redG)+" a partita";
    return ["#"+o.num+" "+esc(o.cognome),SH[o.ruolo]||"",o.starts+" su "+o.games,Math.round(o.tot/60)+"′",f(o.avg),bars(o.mins),trend(o.mins),o.stints?f(o.tot/o.stints):"–",'<span style="color:'+rc+'">'+rt+"</span>",fm(o.f/o.games)]});
  h+='<div class="panel"><h2>Giocatrici</h2>'+tableHtml(["Giocatrice","Ruolo","Titolare","Minuti totali","Media","Andamento","","In campo per turno","Zona rossa","Falli / partita"],rows,2,4)+'<div class="small mu">Media = minuti a partita sulle partite in cui era convocata. Andamento: una barretta per partita, la più recente a destra; la freccia confronta le ultime 3 con quelle prima. In campo per turno = quanto resta dentro, in media, ogni volta che entra.</div></div>';
  const box=(title,list,empty)=>'<div class="panel"><h3>'+title+"</h3>"+(list.length?tableHtml(["",""],list,1).replace(/<thead>.*?<\/thead>/,""):'<p class="mu">'+empty+"</p>")+"</div>";
  const sts=Object.entries(D.Starts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>[e[0],e[1]+(e[1]===1?" partita":" partite")]);
  const lus=Object.entries(D.Ls).sort((a,b)=>b[1].s-a[1].s).slice(0,5).map(e=>[e[0],f(e[1].s)+" in "+e[1].g+(e[1].g===1?" partita":" partite")]);
  const prs=Object.entries(D.Pairs).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>[e[0],f(e[1])+" insieme"]);
  h+='<div class="split">'+box("Quintetti iniziali",sts,"Nessun dato.")+box("Quintetti più usati",lus,"Nessun dato.")+box("Coppie più usate",prs,"Nessun dato.")+"</div>";
  return h}

function tableHtml(head,rows,numFrom,hl){return '<div class="tw"><table><thead><tr>'+head.map((x,i)=>'<th class="'+(i>=numFrom?"r":"")+(i===hl?" hl":"")+'">'+x+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map((x,i)=>'<td class="'+(i>=numFrom?"n":"")+(i===hl?" hl":"")+'">'+x+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>"}

/* G può essere la partita in corso o una salvata (stessa forma) */
function summaryParts(G,fin){
  const P=[...G.players].sort((a,b)=>b.tot-a.tot),byNum={};G.players.forEach(p=>byNum[p.num]=p);
  const nameOf=n=>byNum[n]?esc(dispName(byNum[n],G.players)):n;
  const gm=p=>p.mOn!=null?p.mOn:mOn(p), gb=p=>p.mB!=null?p.mB:mB(p);
  const per=[];for(let q=0;q<=G.qi;q++)per.push(q);
  let pl;
  pl=tableHtml(["Giocatrice","Ruolo","Totale"].concat(per.map(perShort),["Max in campo","Max in panchina","Falli","Fatica"]),P.map(p=>[esc(nm(p)),SH[p.ruolo],f(p.tot)].concat(per.map(q=>f(p.q[q]||0)),[f(gm(p)),f(gb(p)),dotsHtml(p.f)||"–",phrase(p)[0]])),2,2);
  const sc=G.scale||(G.id?5:1),n0=(P[0]&&P[0].tl.length)||0;
  const strips=n0?'<div class="ftab">'+qHead(G.bounds,n0,G.qi)+P.map(p=>'<div class="frow"><b class="fn">'+esc(nm(p))+"</b>"+lanesHtml(p.tl,G.bounds,sc)+'<span class="fp">'+phrase(p)[0]+"</span></div>").join("")+"</div>":'<p class="mu">Nessun minuto giocato.</p>';
  const Lq=Object.entries(G.L).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>{const ns=e[0].split("·");return ['<span class="qn">'+ns.map(nameOf).join(" · ")+"<small>"+ns.join(" · ")+"</small></span>",f(e[1])]});
  const Sq=Object.entries(G.S2).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>{const [x,y]=e[0].split("+");return [nameOf(x)+" + "+nameOf(y),f(e[1])]});
  const Rq=ROLES.filter(r=>G.players.some(p=>p.ruolo===r)).map(r=>{const gp=G.players.filter(p=>p.ruolo===r);return [r,gp.length,f(gp.reduce((s,p)=>s+p.tot,0)/gp.length)]});
  return '<div class="panel"><h2>Giocatrici</h2>'+pl+'</div><div class="panel"><div class="row between"><h2>Fatica nella partita</h2><div class="legend"><span><i class="sw" style="background:var(--ok)"></i>fresca</span><span><i class="sw" style="background:var(--warn)"></i>attenzione</span><span><i class="sw" style="background:var(--bad)"></i>zona rossa</span><span><i class="sw" style="background:var(--azz)"></i>panchina</span><span><i class="sw" style="background:#f2d06a"></i>panchina oltre 8′</span></div></div><div class="small mu">I numeri sono la durata di ogni turno, le linee bianche i cambi di quarto.</div>'+strips+'</div><div class="split"><div class="panel"><h3>Quintetti più usati</h3>'+(Lq.length?tableHtml(["Quintetto","Minuti insieme"],Lq,1):'<p class="mu">Nessun minuto giocato.</p>')+'</div><div class="panel"><h3>Coppie più usate</h3>'+(Sq.length?tableHtml(["Coppia","Minuti insieme"],Sq,1):'<p class="mu">Nessun minuto giocato.</p>')+'</div></div><div class="panel"><h3>Minuti medi per ruolo</h3>'+tableHtml(["Ruolo","Giocatrici","Minuti medi"],Rq,1)+"</div>"}

  if(!fin){
    if(choice)h+='<div class="banner acc"><span>Partita finita o si va al supplementare?</span><div class="row"><button class="btn" data-a="ot">Aggiungi supplementare</button><button class="btn pri" data-a="end">Fine partita</button></div></div>';
    else h+='<div class="banner acc"><span>'+(G.qi===1?"Intervallo lungo: fatica e “da quanto” ripartono da zero.":"Pausa tra i quarti: conta come 2 minuti di recupero per tutte.")+'</span><button class="btn pri" data-a="next">Inizia il '+perName(G.qi+1)+"</button></div>";
  }else h+='<div class="banner acc"><span>Salva la partita per ritrovarla nello storico della squadra.</span><div class="row">'+(S.confirm==="quit"?'<span class="small">Chiudere senza salvare?</span><button class="btn danger" data-a="quit">Sì, chiudi</button><button class="btn" data-a="cancel">No</button>':'<button class="btn" data-a="askQuit">Chiudi senza salvare</button><button class="btn pri" data-a="saveGame">Salva nello storico</button>')+"</div></div>";

function render(){
  if((S.view==="game"||S.view==="summary")&&!g())S.view=db.team?"team":"teams";
  if(["team","roster","five"].includes(S.view)&&!db.team)S.view="teams";
  const V={stats:vStats,splash:vSplash,teams:vTeams,team:vTeam,roster:vRoster,five:vFive,game:vGame,summary:vSummary,hist:vHist,backup:vBackup};
  $("app").innerHTML=(V[S.view]||vTeams)();
  if(S.showText){const t=$("sharetxt");if(t){t.focus();t.select()}}
  ballAnim();
}
let ballT=null;
function ballAnim(){clearInterval(ballT);const b=$("ball");if(!b||window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;let t=0;
  ballT=setInterval(()=>{const bb=$("ball");if(!bb){clearInterval(ballT);return}t+=0.02;bb.setAttribute("cx",300+200*Math.sin(t));bb.setAttribute("cy",190+60*Math.sin(t*2))},40)}

function shareText(G){const fin=G.phase==="ended"||G.saved;let t=(fin?"Minuti partita":"Minuti dopo il "+perName(G.qi))+" · "+G.roster+" vs "+G.opp+" ("+(G.dateIt||itDate(G.dateISO))+")\n";
  [...G.players].sort((a,b)=>b.tot-a.tot).forEach(p=>t+="#"+p.num+" "+p.cognome+": "+f(p.tot)+" · max di fila "+f(p.mOn!=null?p.mOn:mOn(p))+(p.f?" · falli "+p.f:"")+" · "+phrase(p)[1]+"\n");return t}
function copy(text,ok){const fb=()=>{S.showText=text;S.note="";render()};
  try{navigator.clipboard.writeText(text).then(()=>{S.showText=null;S.note=ok;render()}).catch(fb)}catch(e){fb()}}
function saveGameNow(stopped){const G=g(),K=5;stop();
  db.storico.unshift({id:uid(),roster:G.roster,opp:G.opp,dateISO:G.dateISO,dateIt:itDate(G.dateISO),where:G.where,qi:G.qi,periods:G.qi+1,stopped:stopped||null,scale:K,L:G.L,S2:G.S2,bounds:G.bounds.map(b=>Math.floor(b/K)),
    players:G.players.map(p=>{const s=fatStats(p);return{nome:p.nome,cognome:p.cognome,num:p.num,ruolo:p.ruolo,tot:p.tot,q:p.q,mOn:mOn(p),mB:mB(p),f:p.f,warnS:s.warn,redS:s.red,tl:downsample(p.tl,K)}})});
  db.team=G.roster;db.game=null;S.view="team";S.confirm=null;S.note=stopped?"Partita salvata nello storico (interrotta al "+stopped+")":"Partita salvata nello storico";save()}
function downsample(tl,k){const r=[];for(let i=0;i<tl.length;i+=k)r.push(tl[i]);return r}

/* ---------- eventi ---------- */
document.addEventListener("input",e=>{
  if(e.target.id==="red"||e.target.id==="rec"){const c=cfgOf(db.team);c[e.target.id]=+e.target.value;$(e.target.id+"v").textContent=e.target.value+"′";save()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="impfile"&&e.target.files[0]){const r=new FileReader();r.onload=()=>{const t=$("imp");if(t)t.value=r.result};r.readAsText(e.target.files[0])}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"][data-a]')){e.preventDefault();e.target.click()}});

$("app").addEventListener("click",e=>{
  if(noClick)return;
  if(e.target.closest("select,input,textarea"))return;
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;S.err="";
  if(!["share","shareHist","copyExp"].includes(a))S.showText=null;
  const t=db.team,R=t?db.rosters[t]:null;
  switch(a){
    case "enter":S.view="teams";S.note="";break;
    case "toTeams":S.view="teams";S.newMatch=false;S.showCfg=false;S.note="";break;
    case "pickTeam":db.team=v;save();S.view="team";S.newMatch=false;S.showCfg=false;S.note="";S.confirm=null;break;
    case "newTeam":S.newTeam=!S.newTeam;break;
    case "saveTeam":{const n=$("tname").value.trim();if(!n)S.err="Scrivi il nome della squadra";else if(db.rosters[n])S.err="Esiste già una squadra con questo nome";else{db.rosters[n]=[];cfgOf(n);db.team=n;S.newTeam=false;S.view="roster";S.prep=false;S.form=true;S.edit=null;S.note="Squadra "+n+" creata: aggiungi le giocatrici";save()}break}
    case "askDelTeam":S.confirm="delTeam";break;
    case "delTeam":if(g()&&g().roster===t){S.err="C’è una partita in corso con questa squadra";S.confirm=null;break}delete db.rosters[t];delete db.cfg[t];db.team=null;S.confirm=null;S.view="teams";save();break;
    case "toggleCfg":S.showCfg=!S.showCfg;break;
    case "renTeam":{const n=$("tren").value.trim();if(!n){S.err="Scrivi il nome della squadra";break}if(n===t)break;if(db.rosters[n]){S.err="Esiste già una squadra con questo nome";break}
      db.rosters[n]=db.rosters[t];delete db.rosters[t];db.cfg[n]=cfgOf(t);delete db.cfg[t];db.storico.forEach(x=>{if(x.roster===t)x.roster=n});if(g()&&g().roster===t)g().roster=n;db.team=n;S.note="Nome cambiato in "+n;save();break}
    case "newMatch":S.newMatch=!S.newMatch;S.match=null;break;
    case "toRoster":{if(g()){S.err="C’è già una partita in corso: riprendila o chiudila prima";break}
      const opp=$("mopp").value.trim(),iso=$("mdate").value||todayISO(),where=$("mwhere").value;
      S.match={dateISO:iso,opp,where};
      if(!opp){S.err="Scrivi il nome della squadra avversaria";break}
      if(R.length<5){S.err="Servono almeno 5 giocatrici nel roster";break}
      S.conv=[];S.sel5=[];S.prep=true;S.form=false;S.view="roster";S.note="";break}
    case "manageRoster":S.prep=false;S.form=false;S.view="roster";S.note="";break;
    case "backTeam":S.view="team";S.form=false;S.confirm=null;S.note="";S.histId=null;break;
    case "openF":S.form=true;S.edit=null;break;
    case "editP":S.form=true;S.edit=v;break;
    case "closeF":S.form=false;S.edit=null;break;
    case "saveP":{const n=$("fn").value.trim(),c=$("fc").value.trim(),u=parseInt($("fu").value,10),r=$("fr").value;
      if(!n||!c||isNaN(u))S.err="Compila nome, cognome e numero di maglia";
      else if(R.some(p=>p.num===u&&p.id!==S.edit))S.err="Il numero "+u+" è già usato in questa squadra";
      else{if(S.edit){Object.assign(R.find(x=>x.id===S.edit),{nome:n,cognome:c,num:u,ruolo:r});S.note="Modifiche salvate"}else{R.push({id:uid(),nome:n,cognome:c,num:u,ruolo:r});S.note=n+" "+c+" aggiunta"}
        S.form=false;S.edit=null;save()}break}
    case "askDelP":S.confirm="delP:"+v;break;
    case "delP":db.rosters[t]=R.filter(p=>p.id!==v);S.conv=S.conv.filter(x=>x!==v);S.confirm=null;save();break;
    case "cancel":S.confirm=null;break;
    case "conv":if(S.conv.includes(v)){S.conv=S.conv.filter(x=>x!==v);S.sel5=S.sel5.filter(x=>x!==v)}else if(S.conv.length>=12)S.err="Massimo 12 convocate";else S.conv.push(v);S.confirm=null;break;
    case "toFive":if(S.conv.length<5)S.err="Convoca almeno 5 giocatrici";else if(S.conv.length<8)S.confirm="few";else{S.view="five";S.confirm=null}break;
    case "toFiveOk":S.view="five";S.confirm=null;break;
    case "backRoster":S.view="roster";break;
    case "five":if(S.sel5.includes(v))S.sel5=S.sel5.filter(x=>x!==v);else if(S.sel5.length>=5)S.err="Hai già 5 titolari: togline una per cambiarla";else S.sel5.push(v);break;
    case "startGame":{if(S.sel5.length!==5){S.err="Scegli esattamente 5 titolari";break}
      const c=cfgOf(t);
      db.game={roster:t,opp:S.match.opp,dateISO:S.match.dateISO,where:S.match.where,red:c.red,rec:c.rec,qi:0,rem:600,nTo:0,running:false,phase:"play",L:{},S2:{},U:[],bounds:[0],
        players:R.filter(p=>S.conv.includes(p.id)).sort((x,y)=>x.num-y.num).map(p=>({id:p.id,nome:p.nome,cognome:p.cognome,num:p.num,ruolo:p.ruolo,on:S.sel5.includes(p.id),st:0,tot:0,q:{},dOn:0,dB:0,f:0,fa:0,pz:false,tl:[]}))};
      assignSlots(db.game);
      S.view="game";S.sel=null;S.note="Premi Avvia alla palla a due";S.newMatch=false;save();break}
    case "resume":{const G=g();db.team=G.roster;S.view=G.phase==="play"?"game":"summary";S.note="";break}
    case "go":{const G=g();if(G.running)stop();else start();S.note="";break}
    case "to":{const G=g();stop();const dn=DN();G.U.push({t:"to",fa:G.players.map(p=>p.fa),pz:G.players.map(p=>p.pz)});
      G.nTo++;G.players.forEach(p=>{p.fa=Math.max(0,p.fa-60*dn);if(p.on&&p.st>0)p.pz=true});S.tout=true;S.note="";save();break}
    case "speed":S.speed=S.speed===1?10:1;break;
    case "menu":if(g().running)stop();S.view="team";S.sel=null;S.confirm=null;S.note="";break;
    case "askEndq":S.confirm="endq";break;
    case "endq":endPeriod();break;
    case "adj":adjust(+v);break;
    case "p":{const i=+v,P=g().players;if(S.sel===null)S.sel=i;else if(S.sel===i)S.sel=null;else if(P[S.sel].on!==P[i].on)doSwap(S.sel,i);else S.sel=i;break}
    case "foul":{const p=g().players[S.sel];p.f++;g().U.push({t:"f",i:S.sel});S.note=nm(p)+": "+p.f+(p.f>=5?" falli, è fuori: fai il cambio":p.f===4?" falli, attenzione":p.f===1?" fallo":" falli");S.sel=null;save();break}
    case "undo":{const G=g(),x=G.U.pop();if(!x){S.err="Niente da annullare in questo periodo";break}const P=G.players;
      if(x.t==="f"){P[x.i].f--;S.note="Annullato il fallo di "+nm(P[x.i])}
      else if(x.t==="to"){G.nTo--;P.forEach((p,i)=>{p.fa=x.fa[i];p.pz=x.pz[i]});S.tout=false;S.note="Time-out annullato"}
      else{P[x.a].on=!P[x.a].on;P[x.b].on=!P[x.b].on;const sl=P[x.a].slot;P[x.a].slot=P[x.b].slot;P[x.b].slot=sl;P[x.a].st=x.sa;P[x.b].st=x.sb;P[x.a].pz=x.pa;P[x.b].pz=x.pb;S.note="Cambio annullato"}save();break}
    case "next":nextPeriod();break;
    case "back":S.view="game";break;
    case "ot":nextPeriod();break;
    case "end":endGame();break;
    case "share":copy(shareText(g()),"Riepilogo copiato: incollalo dove vuoi");return;
    case "shareHist":{const s=db.storico.find(x=>x.id===S.histId);copy(shareText(Object.assign({saved:true},s)),"Riepilogo copiato: incollalo dove vuoi");return}
    case "askQuit":S.confirm="quit";break;
    case "quit":db.game=null;S.confirm=null;S.view="team";save();break;
    case "saveGame":saveGameNow(null);break;
    case "askClose":stop();S.tout=false;S.sel=null;S.confirm="close";break;
    case "askClose2":S.confirm="close2";break;
    case "closeSave":saveGameNow(perName(g().qi));break;
    case "closeDel":db.game=null;S.confirm=null;S.view="team";S.note="Partita eliminata";save();break;
    case "stats":S.view="stats";S.statsN=S.statsN||0;S.note="";break;
    case "statsN":S.statsN=+v;break;
    case "openHist":S.histId=v;S.view="hist";S.confirm=null;S.note="";break;
    case "askDelH":S.confirm="delH";break;
    case "delH":db.storico=db.storico.filter(s=>s.id!==S.histId);S.confirm=null;S.view="team";S.note="Partita eliminata";save();break;
    case "backup":S.view="backup";S.note="";S.pendingImport=null;break;
    case "copyExp":copy($("exp").value,"Backup copiato");return;
    case "readImp":{try{const d=JSON.parse($("imp").value);if(!d||!d.rosters||typeof d.rosters!=="object"||!Object.keys(d.rosters).length)throw 0;S.pendingImport=d;S.note=""}catch(err){S.err="Questo testo non è un backup valido di Ndemo";S.pendingImport=null}break}
    case "cancelImp":S.pendingImport=null;break;
    case "doImp":{const d=S.pendingImport;db.rosters=d.rosters;db.cfg=d.cfg||{};db.storico=d.storico||[];db.team=null;S.pendingImport=null;S.view="teams";S.note="Backup importato";save();break}
  }
  render();
});

/* trascinamento per i cambi */
$("app").addEventListener("pointerdown",e=>{if(S.view!=="game")return;const r=e.target.closest(".prow");if(!r)return;ds={i:+r.dataset.v,x:e.clientX,y:e.clientY,moved:false}});
document.addEventListener("pointermove",e=>{if(!ds)return;
  if(!ds.moved&&Math.hypot(e.clientX-ds.x,e.clientY-ds.y)>10){ds.moved=true;const gh=$("ghost");gh.innerHTML=prow(g().players[ds.i],-1,g().players);gh.style.display="block";S.sel=null}
  if(!ds.moved)return;e.preventDefault();const gh=$("ghost");gh.style.left=(e.clientX-Math.min(210,window.innerWidth*.4))+"px";gh.style.top=(e.clientY-30)+"px";
  document.querySelectorAll(".prow.tgt").forEach(x=>x.classList.remove("tgt"));
  const el=document.elementFromPoint(e.clientX,e.clientY),r=el&&el.closest("#app .prow");
  if(r){const j=+r.dataset.v;if(g().players[j].on!==g().players[ds.i].on)r.classList.add("tgt")}},{passive:false});
function endDrag(e){if(!ds)return;const d=ds;ds=null;if(!d.moved)return;$("ghost").style.display="none";noClick=true;setTimeout(()=>noClick=false,60);
  S.err="";const el=e&&document.elementFromPoint(e.clientX,e.clientY),r=el&&el.closest("#app .prow");
  if(r){const j=+r.dataset.v;if(g().players[j].on===g().players[d.i].on)S.err="Lasciala sopra una giocatrice dell’altra colonna";else doSwap(d.i,j)}render()}
$("app").addEventListener("pointerdown",()=>{pressing=true},true);
function release(){if(!pressing)return;pressing=false;releasedAt=performance.now();setTimeout(()=>{if(pendingRender&&!busy()){pendingRender=false;render()}},400)}
document.addEventListener("pointerup",e=>{endDrag(e);release()});
document.addEventListener("pointercancel",release);
document.addEventListener("pointercancel",()=>{if(ds){ds=null;$("ghost").style.display="none";render()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&g()&&g().running)wake()});

render();
</script>
